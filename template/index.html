<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="__THEME__">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__TITLE__">
<title>__TITLE__</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Carta d'imbarco: l'app è fatta di documenti di viaggio. Carta color paglia, inchiostro blu notte, un colore di compagnia per viaggio, timbri per ciò che è fatto. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:root{
--bg:#CFC6B1;--paper:#ECE4D2;--paper2:#E2D9C4;--ink:#1D2942;--ink2:#5E5848;--line:#B9AE95;--acc:#EE6A1F;--red:#B8262B;--grn:#2B6B55;--gold:#C98A1B;
--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--body:"Archivo",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
--sh:0 1px 0 rgba(29,41,66,.14);--safe:env(safe-area-inset-bottom,0px);
/* nomi storici usati dal codice */
--cream:var(--bg);--navy:var(--ink);--navy2:var(--acc);--wine:var(--red);--sage:var(--grn);--linen:var(--paper2);--butter:var(--paper)}
html,body{margin:0;padding:0;height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:15.5px/1.45 var(--body);overscroll-behavior-y:none;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;overflow:hidden;position:fixed;inset:0}
#scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:26px}
h1,h2,h3,h4{margin:0;font-weight:800;line-height:1.15}
h3{font-family:var(--disp);font-weight:900;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
h4{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
p{margin:0 0 .6em}
a{color:var(--ink);text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:2px}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}

/* ---- carta d'imbarco in testa ---- */
header{padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0;max-width:664px;margin:0 auto}
.pass{background:var(--paper);border-radius:14px;box-shadow:var(--sh);position:relative}
.strip{background:var(--acc);color:#fff;border-radius:14px 14px 0 0;padding:7px 14px;display:flex;justify-content:space-between;gap:10px;font:700 10.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.route{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 2px}
.route b{font:900 58px/.9 var(--disp);letter-spacing:.01em}
.route .pl{flex:1;height:2px;margin:0 10px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 11px);position:relative}
.route .pl i{position:absolute;left:50%;top:-12px;transform:translateX(-50%);font-style:normal;font-size:17px;line-height:24px;background:var(--paper);padding:0 6px}
.cities{display:flex;justify-content:space-between;gap:10px;padding:0 14px;font:500 10.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;padding:14px}
.pgrid span{display:block;font:400 9px/1.2 var(--mono);letter-spacing:.16em;color:var(--ink2);text-transform:uppercase}
.pgrid b{font:700 14px/1.3 var(--mono);text-transform:uppercase;overflow-wrap:anywhere}
.tear{border-top:2px dashed var(--line);position:relative}
.tear:before,.tear:after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tear:before{left:-10px}.tear:after{right:-10px}
.stubf{display:flex;align-items:center;gap:12px;padding:10px 14px 12px}
.stubf img{width:46px;height:46px;border-radius:8px;display:block}
.bar{flex:1;height:38px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 7px,transparent 7px 9px,var(--ink) 9px 10px,transparent 10px 14px)}
#cd{text-align:right}
#cd b{font:900 30px/1 var(--disp);display:block;white-space:nowrap}
#cd small{display:block;font:400 9px/1.2 var(--mono);letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
body.slim .pass .full,body.slim .cities{display:none}
body.slim .route{padding:8px 14px 8px}
body.slim .route b{font-size:34px}

/* ---- barra in basso: cartellini da valigia ---- */
nav{flex:0 0 auto;z-index:60;background:var(--ink);padding:8px 5px calc(9px + var(--safe));display:flex;gap:4px}
nav button{flex:1;min-width:0;font:700 9px/1 var(--mono);letter-spacing:.08em;color:#B9C2D6;border:1.5px solid rgba(185,194,214,.28);border-radius:5px 5px 5px 13px;padding:11px 0 10px}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav button[data-t="s-arrivo"]{flex:1.65;letter-spacing:.03em}

section{display:none;padding-top:14px;animation:fade .22s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.card{background:var(--paper);border-radius:10px;box-shadow:var(--sh);padding:14px;margin-bottom:10px;overflow-wrap:anywhere}
.card.flat{box-shadow:none;background:transparent;border:2px dashed var(--line)}
.card.soft{border-top:6px solid var(--acc)}
.tt{font:900 22px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase;margin:20px 2px 8px}
.muted{color:var(--ink2);font-size:13px}
.small{font-size:12.5px}
.pill{display:inline-block;font:500 10px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--line);color:var(--ink);max-width:100%;text-align:left}
.pill.g{border-color:var(--grn);color:var(--grn)}.pill.y{border-color:var(--gold);color:#7A5208;background:#F5E7BE}.pill.b{border-color:var(--ink);background:var(--ink);color:var(--paper)}.pill.r{border-color:var(--red);color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:var(--paper);border-radius:6px;padding:11px 14px;font:700 11.5px/1.25 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;max-width:100%;text-align:center}
.btn.sec{background:var(--paper2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.btn.full{display:flex;width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
hr{border:none;border-top:2px dashed var(--line);margin:14px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 12px 8px;margin:0 -12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px 7px;border-radius:5px 5px 5px 13px;background:var(--paper);font:700 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);box-shadow:var(--sh)}
.chip.on{background:var(--ink);color:var(--paper)}

/* ---- giornate e biglietti ---- */
.dh{margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:700 10.5px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;width:calc(100% - 4px);text-align:left}
.dh b{font:900 28px/1 var(--disp);letter-spacing:.03em;border-bottom:4px solid var(--dc,var(--acc))}
.dsub{font-size:13px;color:var(--ink2);margin:-2px 2px 8px}
.daystats{display:flex;gap:5px;flex-wrap:wrap;margin:0 2px 8px}
.tk{background:var(--paper);border-radius:10px;display:grid;grid-template-columns:70px 1fr;position:relative;box-shadow:var(--sh);margin-bottom:8px;width:100%;text-align:left}
.tk .h{border-right:2px dashed var(--line);padding:11px 0 9px 12px;font:700 15px/1.2 var(--mono)}
.tk .h small{display:block;font:400 9px/1.2 var(--mono);letter-spacing:.12em;color:var(--ink2);margin-top:3px;text-transform:uppercase}
.tk .bd{padding:10px 12px;min-width:0}
.tk .bd b{display:block;font:700 15px/1.2 var(--body)}
.tk .bd .met{font:400 11px/1.35 var(--mono);color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.tk.done .bd{padding-right:76px}
.tk.now{box-shadow:0 0 0 2.5px var(--acc)}
.tk.fix .h{color:var(--acc)}
.tk.pk{grid-template-columns:46px 1fr}
.tk.pk .h{font-size:20px;text-align:center;padding:10px 0 0;color:var(--grn)}
.stamp{position:absolute;right:9px;top:50%;width:60px;height:60px;margin-top:-30px;border:2.5px solid var(--red);border-radius:50%;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 8.5px/1.25 var(--mono);letter-spacing:.1em;text-align:center;transform:rotate(-14deg);opacity:.85;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--red);pointer-events:none;text-transform:uppercase}
.stamp.g{border-color:var(--grn);color:var(--grn);transform:rotate(9deg);box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4.5px var(--grn)}
.stamp.sm{position:static;margin:6px auto 0;width:50px;height:50px;font-size:7.5px}
.trf{display:flex;align-items:center;gap:6px;font:400 10.5px/1.3 var(--mono);color:var(--ink2);letter-spacing:.04em;margin:0 0 8px 26px;flex-wrap:wrap}
.trf:before{content:"↓"}
.nowc{border-top:0;padding:0;overflow:hidden}
.nowc .k{background:var(--acc);color:#fff;padding:7px 14px;font:700 10.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.nowc .in{padding:12px 14px 14px}
.nowc h3{margin:0 0 4px}

/* ---- fogli, schede, moduli ---- */
.sheetbg{position:fixed;inset:0;background:rgba(29,41,66,.55);z-index:1200;display:none;align-items:flex-end}
.sheetbg.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:8px 14px calc(18px + var(--safe));animation:up .2s ease;max-height:86dvh;overflow:auto}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:38px;height:4px;background:var(--line);border-radius:9px;margin:6px auto 12px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:13px 6px;font-size:14.5px;font-weight:600;text-align:left;border-bottom:2px dashed var(--line)}
.opt:last-child{border-bottom:none}
.opt .dot{width:10px;height:10px;border-radius:2px;flex:none}
.tip{border-left:4px solid var(--gold);padding:6px 0 6px 11px;font-size:13px;line-height:1.42;margin-top:10px}
.tip b{display:block;font:700 9.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#7A5208;margin-bottom:3px}
.kv{display:flex;gap:8px;font-size:13.5px;padding:8px 0;border-bottom:2px dashed var(--line)}
.kv:last-child{border:none}
.kv b{flex:none;width:96px;color:var(--ink2);font:500 9.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.1em;padding-top:2px}
.kv span{flex:1;min-width:0;overflow-wrap:anywhere}
.say{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:4px;background:var(--paper2);font-size:13px;margin-left:6px;vertical-align:middle}
#lmap{height:56vh;min-height:320px;border-radius:10px;box-shadow:var(--sh);background:var(--paper2);z-index:1}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font:700 11px/1 var(--mono);display:flex;align-items:center;justify-content:center;border:2.5px solid var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--line)}
.ck:last-child{border:none}
.ck .box{width:22px;height:22px;border-radius:3px;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:var(--paper);margin-top:1px}
.ck.done .box{background:var(--grn);border-color:var(--grn)}
.ck.done .bd b{text-decoration:line-through;opacity:.5}
.ck .bd{flex:1;min-width:0}
.ck .bd b{font-size:14px;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gcell{position:relative;background:#fff;padding:4px 4px 16px;box-shadow:var(--sh)}
.gcell:nth-child(3n+1){transform:rotate(-1.2deg)}.gcell:nth-child(3n){transform:rotate(1deg)}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--paper2)}
.gcell .who{position:absolute;left:5px;bottom:2px;font:500 8.5px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.gcell .up{position:absolute;right:5px;bottom:2px;font:500 8.5px/1.3 var(--mono);color:var(--acc)}
.lb{position:fixed;inset:0;background:rgba(15,20,34,.96);z-index:1300;display:none;flex-direction:column;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + var(--safe))}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:66vh;object-fit:contain;margin:0 auto;display:block;border:6px solid #fff}
.lb .ctr{margin-top:14px;max-width:640px;width:100%;margin-left:auto;margin-right:auto}
.lb input{margin-bottom:9px}
.drop{border:2px dashed var(--ink);border-radius:10px;padding:20px 14px;text-align:center;display:block;margin-bottom:12px;font:700 12px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.drop span{display:block;font:400 12.5px/1.4 var(--body);letter-spacing:0;text-transform:none;color:var(--ink2);margin-top:3px}
.inp{width:100%;background:#F6F1E4;border:1.5px solid var(--line);border-radius:6px;padding:11px 12px;font:500 14px/1.3 var(--mono);color:var(--ink)}
.diary{width:100%;min-height:80px;background:#F6F1E4;border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;font:15px/1.4 var(--body);color:var(--ink);resize:vertical;margin-top:6px}
.wx{display:flex;gap:10px;align-items:center}
.wx .big{font-size:38px;line-height:1}
.wx .t{font:900 40px/1 var(--disp)}
.wxd{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.wxd div{flex:1;min-width:66px;text-align:center;background:var(--paper2);border-radius:6px;padding:7px 4px;font:500 10.5px/1.4 var(--mono)}
.wxd div span{display:block;font-size:20px}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.pp{text-align:center;padding:8px 6px 9px;border-radius:6px;background:#F6F1E4;border:1.5px solid var(--line);font:700 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.pp.me{border-color:var(--ink)}
.av{width:74px;height:86px;border-radius:4px;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font:900 38px/1 var(--disp);color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:30px;height:30px;font-size:15px;margin:0;flex:none}
.ph{display:flex;gap:10px;overflow-x:auto;margin:0 -12px 4px;padding:4px 12px 8px;scrollbar-width:none}
.ph figure{flex:none;width:76%;margin:0;background:#fff;padding:6px 6px 8px;box-shadow:var(--sh)}
.ph figure:nth-child(odd){transform:rotate(-.8deg)}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--paper2)}
.ph figcaption{font:400 9.5px/1.35 var(--mono);color:var(--ink2);margin-top:5px}
.exp{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:2px dashed var(--line);font-size:13.5px}
.exp:last-child{border:none}
.exp .bd{flex:1;min-width:0}
.exp .bd b{display:block;font-size:14px}
.exp .amt{font:700 14px/1 var(--mono);font-variant-numeric:tabular-nums;flex:none}
.exp .x,.xbtn{width:28px;height:28px;border-radius:4px;background:var(--paper2);font-size:14px;flex:none}
.big{font:900 34px/1 var(--disp)}
.bar2{height:8px;background:var(--paper2);margin-top:5px;box-shadow:inset 0 0 0 1px var(--line)}
.bar2 i{display:block;height:100%;background:var(--ink)}
.bar2 i.over{background:var(--red)}
.brow{padding:10px 0;border-bottom:2px dashed var(--line);font-size:13.5px}
.brow:last-child{border:none}
.brow .l{display:flex;gap:8px;align-items:center}
.brow .l b{flex:1;min-width:0}
.brow input{width:86px;text-align:right;padding:6px 8px}
.bal{border:2px solid var(--grn);border-radius:6px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.tog{display:inline-block;padding:6px 9px;border-radius:3px;border:1.5px solid var(--line);font:500 10.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 5px 5px 0}
.tog.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.srch{position:fixed;inset:0;background:var(--bg);z-index:1250;display:none;flex-direction:column}
.srch.on{display:flex}
.srch .sb{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:var(--paper)}
.srch .res{flex:1;overflow:auto;padding:10px 12px 20px;max-width:640px;width:100%;margin:0 auto}
.wdoc{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:2px dashed var(--line)}
.wdoc .bd{flex:1;min-width:0}
.wdoc .bd b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wdoc{flex-wrap:wrap}
.wdoc button{min-width:34px;padding:0 8px;white-space:nowrap;height:34px;border-radius:4px;background:var(--paper2);font:700 11px/1 var(--mono)}
.intro{position:fixed;inset:0;z-index:1400;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;transition:opacity .5s}
.intro img{width:170px;height:170px;border-radius:26px;border:5px solid var(--paper);object-fit:cover}
#introVid{width:100%;max-width:340px;aspect-ratio:9/16;max-height:58vh;border-radius:14px;overflow:hidden;background:#000;position:relative}
#introVid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.intro h1{font:900 54px/.95 var(--disp);text-transform:uppercase;letter-spacing:.02em;margin:18px 0 6px}
.intro .sub{font:500 11px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.intro .btn{margin-top:18px;background:var(--acc);color:#fff;padding:13px 26px}
.intro .inp{margin-bottom:8px}
.fin{text-align:center;padding:26px 10px 14px;color:var(--ink2);font:400 10.5px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase}
</style>

</head>
<body>
<div id="scroll">
<header><div class="pass">
  <div class="strip"><span>I nostri viaggi insieme</span><span id="hTitle"></span></div>
  <div class="route"><b id="hFrom"></b><div class="pl"><i id="hIco"></i></div><b id="hTo"></b></div>
  <div class="cities"><span id="hCityF"></span><span id="hCityT"></span></div>
  <div class="full"><div class="pgrid" id="hGrid"></div><div class="tear"></div>
    <div class="stubf"><img src="icon-192.png" alt=""><div class="bar"></div><div id="cd"></div></div></div>
</div></header>
<main class="wrap">
<section id="s-gruppo" class="on"></section>
<section id="s-meta"></section>
<section id="s-arrivo"></section>
<section id="s-viaggio">
  <div class="chips" id="vChips"></div>
  <div id="vBody"></div>
  <div id="lmapWrap" style="display:none"><div id="lmap"></div><p class="muted small" style="margin-top:8px">I numeri seguono l'ordine della giornata. Lo sfondo della mappa richiede rete; senza rete restano tappe e percorso.</p></div>
</section>
<section id="s-conti"></section>
<section id="s-foto">
  <div id="fotoTop"></div>
  <label class="drop"><input type="file" id="fileIn" accept="image/*" multiple style="display:none">
    Aggiungi foto<span>Scatta o scegli dalla galleria, anche più foto insieme</span></label>
  <div class="chips" id="albumChips"></div>
  <div id="gallery"></div>
