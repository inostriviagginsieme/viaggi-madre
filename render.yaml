services:
  - type: web
    name: inostriviagginsieme
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GOOGLE_MAPS_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        value: inostriviagginsieme
      - key: RENDER_API_KEY
        sync: false
      - key: PEECHO_API_KEY
        sync: false
      - key: PEECHO_SECRET
        sync: false
      - key: PEECHO_ENV
        value: test
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
